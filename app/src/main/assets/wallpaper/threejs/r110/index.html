<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Built-in Three.js wallpaper</title>
    <style>
        html, body, #wallpaper, #player-root, #player-root > div {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #070a13;
        }
        body { position: fixed; inset: 0; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            padding: 32px;
            color: #e7e1ff;
            background: #070a13;
            font: 16px/1.6 sans-serif;
            text-align: center;
            white-space: pre-wrap;
        }
    </style>
    <script src="three.r110.min.js"></script>
    <script src="app.r110.js"></script>
</head>
<body>
<div id="wallpaper">
    <div id="player-root"></div>
    <div id="status">Three.js を起動しています…</div>
</div>
<script>
(function () {
    'use strict';

    var root = document.getElementById('player-root');
    var status = document.getElementById('status');
    var player = null;

    function showError(error) {
        var detail = error && error.message ? error.message : String(error || 'unknown error');
        status.textContent = 'Three.js 壁紙を起動できませんでした。\n' + detail;
        status.style.display = 'grid';
        console.error('Three.js wallpaper failed:', error);
    }

    try {
        if (!window.THREE || !window.APP || !window.APP.Player) {
            throw new Error('内蔵ランタイムの読み込みに失敗しました');
        }

        // APP.Player is the generic Three.js Editor runtime. Its input is a project
        // JSON, so this small generated scene is only an in-app rendering smoke test.
        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a13);
        scene.fog = new THREE.Fog(0x070a13, 9, 22);

        var ambient = new THREE.AmbientLight(0xffffff, 0.72);
        scene.add(ambient);

        var keyLight = new THREE.PointLight(0x9e7bff, 2.2, 24);
        keyLight.position.set(3, 4, 6);
        scene.add(keyLight);

        var fillLight = new THREE.PointLight(0x42d9ee, 1.5, 22);
        fillLight.position.set(-4, -2, 4);
        scene.add(fillLight);

        var knot = new THREE.Mesh(
            new THREE.TorusKnotGeometry(1.25, 0.34, 144, 18, 2, 3),
            new THREE.MeshStandardMaterial({
                color: 0xb9a0ff,
                metalness: 0.48,
                roughness: 0.24
            })
        );
        scene.add(knot);

        var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 50);
        camera.position.set(0, 0, 7.5);
        camera.lookAt(0, 0, 0);

        var project = {
            project: { shadows: false, vr: false },
            scene: scene.toJSON(),
            camera: camera.toJSON(),
            scripts: {}
        };
        project.scripts[knot.uuid] = [{
            source: 'function update(event) {\n' +
                '  this.rotation.x = Math.sin(event.time * 0.00022) * 0.28;\n' +
                '  this.rotation.y = event.time * 0.00032;\n' +
                '}'
        }];

        player = new APP.Player();
        window.threeWallpaperPlayer = player;
        root.appendChild(player.dom);
        player.load(project);

        function resize() {
            if (!player) return;
            var width = Math.max(1, root.clientWidth || window.innerWidth || 1);
            var height = Math.max(1, root.clientHeight || window.innerHeight || 1);
            player.setSize(width, height);
        }

        window.addEventListener('resize', resize, { passive: true });
        resize();
        player.play();
        status.style.display = 'none';
    } catch (error) {
        showError(error);
    }
}());
</script>
</body>
</html>
