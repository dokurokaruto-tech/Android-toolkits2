<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Three.js wallpaper artwork</title>
    <style>
        html, body, #wallpaper, #player-root, #player-root > div {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #070a13;
        }
        body { position: fixed; inset: 0; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }
        #status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            padding: 32px;
            color: #e7e1ff;
            background: #070a13;
            font: 16px/1.6 sans-serif;
            text-align: center;
            white-space: pre-wrap;
        }
    </style>
    <script src="three.r110.min.js"></script>
    <script src="app.r110.js"></script>
</head>
<body>
<div id="wallpaper">
    <div id="player-root"></div>
    <div id="status">Three.js アートを読み込んでいます…</div>
</div>
<script>
(function () {
    'use strict';

    var root = document.getElementById('player-root');
    var status = document.getElementById('status');
    var player = null;

    function showError(error) {
        var detail = error && error.message ? error.message : String(error || 'unknown error');
        status.textContent = 'Three.js アートを起動できませんでした。\n' + detail;
        status.style.display = 'grid';
        console.error('Three.js wallpaper failed:', error);
    }

    try {
        if (!window.THREE || !window.APP || !window.APP.Player || !window.ThreeJsAssets) {
            throw new Error('内蔵ランタイムまたはプロジェクトが読み込めません');
        }

        var jsonLength = window.ThreeJsAssets.getProjectJsonLength();
        var jsonChunks = [];
        var chunkSize = 48 * 1024;
        var offset = 0;
        while (offset < jsonLength) {
            var packet = window.ThreeJsAssets.getProjectJsonChunk(offset, chunkSize);
            var separator = packet.indexOf('\n');
            if (separator < 0) throw new Error('プロジェクトJSONの読み込みに失敗しました');
            var nextOffset = Number(packet.substring(0, separator));
            if (!isFinite(nextOffset) || nextOffset <= offset) {
                throw new Error('プロジェクトJSONの読み込み位置が不正です');
            }
            jsonChunks.push(packet.substring(separator + 1));
            offset = nextOffset;
        }
        var project = JSON.parse(jsonChunks.join(''));
        if (!project || !project.scene || !project.camera) {
            throw new Error('app.json にシーンまたはカメラがありません');
        }

        player = new APP.Player();
        window.threeWallpaperPlayer = player;
        root.appendChild(player.dom);
        player.load(project);

        function resize() {
            if (!player) return;
            var width = Math.max(1, root.clientWidth || window.innerWidth || 1);
            var height = Math.max(1, root.clientHeight || window.innerHeight || 1);
            player.setSize(width, height);
        }

        window.addEventListener('resize', resize, { passive: true });
        resize();
        player.play();
        status.style.display = 'none';

        // Gallery thumbnails render briefly, then hold a still frame to save power.
        if (window.ThreeJsAssets.isPreviewMode()) {
            window.setTimeout(function () {
                if (player) player.stop();
            }, 1400);
        }
    } catch (error) {
        showError(error);
    }
}());
</script>
</body>
</html>
